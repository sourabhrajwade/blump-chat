[project]
name = "backend"
version = "0.1.0"
description = "FastAPI file upload with MinIO and MongoDB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "motor>=3.6.0",
    "minio>=7.2.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "pymupdf>=1.24.0",
    "pytesseract>=0.3.10",
    "pillow>=10.0.0",
    "qdrant-client>=1.12.0",
]

[tool.uv]
dev-dependencies = []
